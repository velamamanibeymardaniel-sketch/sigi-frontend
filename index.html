<!DOCTYPE html>  <html lang="es"><head><meta charset="utf-8"><title>SIGI — Gestión de Solicitudes Internas</title>  
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">  
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">  
<style>  
:root{--bg:#f4f6f5;--card:#fff;--tx:#17231f;--mu:#62716b;--bd:#dde4e0;--ac:#0f6b57;--ac2:#e3f1ec;--rd:#c0392b;--am:#b7791f;--gn:#2f855a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}  
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101715;--card:#18221f;--tx:#e6eeea;--mu:#93a39c;--bd:#2a3733;--ac:#3cb596;--ac2:#18332c;--rd:#ef7d6f;--am:#e0b25a;--gn:#5fc38c}}  
:root[data-theme=dark]{--bg:#101715;--card:#18221f;--tx:#e6eeea;--mu:#93a39c;--bd:#2a3733;--ac:#3cb596;--ac2:#18332c;--rd:#ef7d6f;--am:#e0b25a;--gn:#5fc38c}  
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}  
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 'IBM Plex Sans',system-ui,sans-serif}  
h1{font-size:22px;margin:0 0 4px}h2{font-size:15px;margin:0 0 10px}  
#app{display:flex;min-height:100vh}  
aside{width:232px;background:var(--card);border-right:1px solid var(--bd);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto;flex:none}  
aside .org{font-weight:600;padding:6px 10px 14px;font-size:15px}aside .org small{display:block;color:var(--mu);font-weight:400}  
aside a{display:flex;justify-content:space-between;padding:8px 10px;border-radius:6px;color:var(--tx);text-decoration:none;cursor:pointer}  
aside a:hover{background:var(--bg)}aside a.on{background:var(--ac2);color:var(--ac);font-weight:600}  
main{flex:1;min-width:0}.top{display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--bd)}  
.top .sp{flex:1}.pad{padding:20px;max-width:1200px}  
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:16px;margin-bottom:16px}  
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:16px}  
.k{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px}.k b{display:block;font-size:26px;font-weight:600}.k span{color:var(--mu);font-size:12px}  
.g2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}  
button,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 12px;border-radius:6px;cursor:pointer}  
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.d{color:var(--rd)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:1px}  
input,select,textarea{font:inherit;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;max-width:100%}  
textarea{width:100%;min-height:70px}label{display:block;margin:8px 0 2px;color:var(--mu);font-size:12px}  
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:end}.bar label{margin:0}  
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu);font-weight:500;cursor:pointer}  
tr.late{background:color-mix(in srgb,var(--rd) 10%,transparent)}tr.row{cursor:pointer}tr.row:hover{background:var(--bg)}  
.b{padding:2px 8px;border-radius:10px;font-size:12px;background:var(--bg);border:1px solid var(--bd)}  
.s-ok{color:var(--gn)}.s-warn{color:var(--am)}.s-late{color:var(--rd);font-weight:600}  
.p-Crítica{border-color:var(--rd);color:var(--rd)}.p-Alta{border-color:var(--am);color:var(--am)}  
.hb{display:flex;align-items:center;gap:8px;margin:4px 0}.hb i{flex:none;width:110px;font-style:normal;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb u{display:block;height:14px;background:var(--ac);border-radius:3px;text-decoration:none}.hb em{font-style:normal;font-size:12px}  
.tl{border-left:2px solid var(--bd);margin-left:6px;padding-left:14px}.tl div{margin-bottom:10px;position:relative}.tl div:before{content:"";position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--ac)}  
.login{max-width:380px;margin:8vh auto;padding:0 16px}.demo{background:var(--ac2);border-radius:8px;padding:10px;margin-top:12px;font-size:12px}.demo a{color:var(--ac);cursor:pointer;text-decoration:underline}  
.toast{position:fixed;bottom:20px;right:20px;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:9}  
.nt{padding:10px;border-bottom:1px solid var(--bd);cursor:pointer}.nt.un{font-weight:600;background:var(--ac2)}  
#mb{display:none}  
@media(max-width:800px){aside{position:fixed;z-index:5;left:-250px;transition:left .2s}aside.open{left:0}#mb{display:inline-block}.pad{padding:12px}}  
@media print{aside,.top,.bar button{display:none}}  
</style></head><body><div id="app"><p style="padding:20px">Cargando…</p></div><noscript>SIGI necesita JavaScript activado para funcionar.</noscript>  
<script src="config.js"></script>  
<script>  
const API=((window.SIGI_CONFIG&&window.SIGI_CONFIG.apiUrl)||'').replace(/\/+$/,'')+'/api'; // vacío = mismo dominio  
const ST=['Pendiente','Asignada','En proceso','Resuelta','Cerrada','Cancelada'],PR=['Baja','Media','Alta','Crítica'],H=36e5,D=24*H;  
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));  
const fd=t=>t?new Date(t).toLocaleString('es',{dateStyle:'short',timeStyle:'short'}):'—';  
let db={org:{name:'',near:25},areas:[],types:[],users:[],reqs:[],notifs:[],prios:[]},S={u:null,tk:null,v:'dash',id:null,f:{per:'all'},q:'',pg:0,sort:'created',dir:-1,msg:''};  
// ---- capa de datos: API REST del backend (mismo origen) ----  
let pend=0;const wake=on=>{let e=document.getElementById('wake');if(on&&!e){e=document.createElement('div');e.id='wake';e.className='toast';e.setAttribute('role','status');e.textContent='Conectando con el servidor… la primera vez puede tardar hasta un minuto.';document.body.appendChild(e)}else if(!on&&e)e.remove()};  
const api=async(m,p,b)=>{const ac=new AbortController(),tm=setTimeout(()=>wake(true),3000),to=setTimeout(()=>ac.abort(),120000);pend++;let r,j;  
try{for(let t=0;;t++){r=await fetch(API+p,{method:m,signal:ac.signal,headers:{'Content-Type':'application/json',...(S.tk?{Authorization:'Bearer '+S.tk}:{})},body:b?JSON.stringify(b):undefined});j=await r.json().catch(()=>({}));  
if([502,503,504].includes(r.status)&&!j.error&&t<8){wake(true);await new Promise(x=>setTimeout(x,5000));continue}break}}  
catch(e){throw new Error(e.name=='AbortError'?'El servidor tardó demasiado en responder. Inténtalo de nuevo en un momento.':'No se pudo conectar con el servidor. Revisa tu conexión e inténtalo de nuevo.')}  
finally{clearTimeout(tm);clearTimeout(to);if(--pend<=0){pend=0;wake(false)}}  
if(r.status==401&&S.tk&&p!='/login'){logout();throw new Error('Tu sesión expiró. Inicia sesión nuevamente.')}if(!r.ok)throw new Error(j.error||(r.status>=500?'El servidor tuvo un problema. Inténtalo de nuevo en unos minutos.':'No se pudo completar la acción ('+r.status+').'));return j};  
const mut=async(f,id,msg)=>{try{await f();await load();if(msg)toast(msg);id?await openDet(id):render()}catch(e){toast(e.message)}};  
const su=u=>({id:u.id,n:u.name,e:u.email,role:u.role,area:u.area_id});  
const mapR=r=>({id:r.id,code:r.code,title:r.title,desc:r.description,obs:r.notes,areaSol:r.req_area_id,type:r.type_id,areaResp:r.resp_area_id,prio:r.prio_level,creator:r.creator_id,assignee:r.assignee_id,status:r.status,created:r.created_at,due:r.due_at,assignedAt:r.assigned_at,startedAt:r.started_at,resolvedAt:r.resolved_at,closedAt:r.closed_at,hist:[],comments:[],files:[]});  
async function load(){const[c,n]=await Promise.all([api('GET','/catalog'),api('GET','/notifications')]);  
db.org={name:c.org.name,near:+(c.settings.near_pct||25),demo:c.settings.demo=='1'};db.areas=c.areas.map(a=>({id:a.id,n:a.name,on:a.active}));db.types=c.types.map(t=>({id:t.id,n:t.name,area:t.area_id,sla:t.sla_hours,on:t.active}));db.prios=c.priorities;  
db.notifs=n.map(x=>({id:x.id,uid:S.u.id,txt:x.text,rid:x.request_id,at:x.at,read:x.read}));  
db.users=S.u.role=='admin'?(await api('GET','/users')).map(u=>({id:u.id,n:u.name,e:u.email,role:u.role_id,area:u.area_id,on:u.active})):c.users.map(u=>({id:u.id,n:u.name,e:'',role:u.role,area:u.area_id,on:1}));  
let l=[],pg=0,j;do{j=await api('GET','/requests?size=100&page='+pg++);l=l.concat(j.items)}while(l.length<j.total&&j.items.length);  
const old=Object.fromEntries(db.reqs.map(q=>[q.id,q]));db.reqs=l.map(r=>{const q=mapR(r),o=old[q.id];if(o){q.hist=o.hist;q.comments=o.comments;q.files=o.files}return q})}  
async function openDet(id){try{const d=await api('GET','/requests/'+id);let q=db.reqs.find(x=>x.id==id);if(!q){q=mapR(d);db.reqs.push(q)}  
q.hist=d.history.map(h=>({from:h.from_status,to:h.to_status,by:h.user_id,byN:h.user_name,at:h.at,c:h.comment}));q.comments=d.comments.map(c=>({by:c.user_id,byN:c.user_name,at:c.at,m:c.body}));q.files=d.files;go('det',id)}catch(e){toast(e.message)}}  
const dlBlob=(b,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click()};  
async function dlf(id,n){try{const r=await fetch(API+'/files/'+id,{headers:{Authorization:'Bearer '+S.tk}});if(!r.ok)throw new Error('No se pudo descargar');dlBlob(await r.blob(),n)}catch(e){toast(e.message)}}  
// ---- lógica de negocio ----  
const U=id=>db.users.find(u=>u.id==id),A=id=>db.areas.find(a=>a.id==id),T=id=>db.types.find(t=>t.id==id);  
function sla(q){const end=q.resolvedAt||q.closedAt,tot=q.due-q.created;if(q.status=='Cancelada')return{k:'na',t:'—'};  
if(end)return end<=q.due?{k:'ok',t:'Cumplido'}:{k:'late',t:'Fuera de plazo'};const left=q.due-Date.now();  
if(left<0)return{k:'late',t:'Atrasada '+hh(-left)};return left<tot*db.org.near/100?{k:'warn',t:'Próxima a vencer · '+hh(left)}:{k:'ok',t:'En plazo · '+hh(left)}}  
const hh=ms=>ms>=2*D?Math.floor(ms/D)+' d':Math.max(1,Math.round(ms/H))+' h',open=q=>!['Resuelta','Cerrada','Cancelada'].includes(q.status);  
function can(q,a){const r=S.u.role,mine=q.assignee==S.u.id,own=q.creator==S.u.id;  
return a=='assign'?r=='admin'&&open(q):a=='accept'?(r=='admin'||mine&&r=='resp')&&q.status=='Asignada':a=='resolve'?(r=='admin'||mine&&r=='resp')&&q.status=='En proceso':a=='close'?(r=='admin'||own)&&q.status=='Resuelta':a=='cancel'?(r=='admin'||own&&q.status=='Pendiente')&&open(q):0}  
function visible(){const r=S.u.role;return db.reqs.filter(q=>r=='admin'||(r=='resp'?q.assignee==S.u.id||q.creator==S.u.id:q.creator==S.u.id))}  
function filt(l,f){const n=new Date(),d0=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();let a=0,b=1e15;  
if(f.per=='today')a=d0;if(f.per=='week')a=d0-((n.getDay()+6)%7)*D;if(f.per=='month')a=new Date(n.getFullYear(),n.getMonth(),1).getTime();if(f.per=='year')a=new Date(n.getFullYear(),0,1).getTime();  
if(f.per=='custom'){a=f.from?new Date(f.from).getTime():0;b=f.to?new Date(f.to).getTime()+D:1e15}  
return l.filter(q=>q.created>=a&&q.created<b&&(!f.area||q.areaResp==f.area)&&(!f.resp||q.assignee==f.resp)&&(!f.type||q.type==f.type)&&(f.prio==null||f.prio===''||q.prio==f.prio)&&(!f.st||q.status==f.st))}  
function kpis(l){const done=l.filter(q=>q.resolvedAt||q.closedAt),ok=done.filter(q=>(q.resolvedAt||q.closedAt)<=q.due).length,late=l.filter(q=>sla(q).k=='late').length,av=done.length?done.reduce((s,q)=>s+((q.resolvedAt||q.closedAt)-q.created),0)/done.length:0;  
return{tot:l.length,res:l.filter(q=>q.status=='Resuelta').length,pen:l.filter(q=>q.status=='Pendiente').length,late,warn:l.filter(q=>open(q)&&sla(q).k=='warn').length,av,pok:done.length?Math.round(ok/done.length*100):0,pl:l.length?Math.round(late/l.length*100):0}}  
const grp=(l,fn)=>{const m={};l.forEach(q=>{const k=fn(q);m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])};  
// ---- UI helpers ----  
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2500)}  
const go=(v,id)=>{S.v=v;S.id=id||null;S.pg=0;document.querySelector('aside')?.classList.remove('open');render()};  
const opts=(l,sel,all)=>(all?`<option value="">${all}</option>`:'')+l.map(o=>`<option value="${o[0]}" ${String(o[0])==String(sel)?'selected':''}>${esc(o[1])}</option>`).join('');  
const hbars=l=>{const m=Math.max(1,...l.map(x=>x[1]));return l.length?l.map(([k,v])=>`<div class="hb"><i title="${esc(k)}">${esc(k)}</i><u style="width:${v/m*60}%"></u><em>${v}</em></div>`).join(''):'<p style="color:var(--mu)">Sin datos</p>'};  
const badge=q=>`<span class="b">${q.status}</span>`,pb=p=>`<span class="b p-${PR[p]}">${PR[p]}</span>`;  
function slaTxt(q){const s=sla(q);return `<span class="s-${s.k}">${s.t}</span>`}  
function menu(){const r=S.u.role,m=[['dash','Dashboard'],['list',r=='emp'?'Mis solicitudes':'Solicitudes'],['new','Nueva solicitud']];  
if(r!='emp')m.push(['inbox','Bandeja de atención']);if(r!='emp')m.push(['rep','Reportes']);  
if(r=='admin')m.push(['users','Usuarios'],['areas','Áreas'],['types','Tipos de solicitud'],['cfg','Configuración']);  
m.push(['notifs','Notificaciones'],['prof','Perfil']);return m}  
// ---- vistas ----  
function render0(){const a=document.getElementById('app');  
if(!S.u){a.innerHTML=`<div class="login card"><h1>SIGI</h1><p style="color:var(--mu)">Sistema Integral de Gestión de Solicitudes Internas</p><label>Correo</label><input id="le" style="width:100%" value="admin@demo.com"><label>Contraseña</label><input id="lp" type="password" style="width:100%" value="demo1234"><p style="color:var(--rd)">${S.msg}</p><button class="p" onclick="login()">Ingresar</button>  
<div class="demo"><b>Cuentas DEMO · datos ficticios</b><br>Contraseña de todas: demo1234<br><a onclick="fill('admin@demo.com')">Administrador</a> · <a onclick="fill('responsable@demo.com')">Responsable</a> · <a onclick="fill('empleado@demo.com')">Empleado</a></div></div>`;return}  
const un=db.notifs.filter(n=>n.uid==S.u.id&&!n.read).length,guard=menu().some(m=>m[0]==S.v)||S.v=='det';if(!guard)S.v='dash';  
a.innerHTML=`<aside id="sb"><div class="org">${esc(db.org.name)}<small>SIGI · ${db.demo?'DATOS DEMO':'Producción'}</small></div>${menu().map(m=>`<a class="${S.v==m[0]?'on':''}" onclick="go('${m[0]}')">${m[1]}${m[0]=='notifs'&&un?`<span class="b">${un}</span>`:''}</a>`).join('')}</aside>  
<main><div class="top"><button id="mb" onclick="document.getElementById('sb').classList.toggle('open')">☰</button><b>${{admin:'Administrador',resp:'Responsable',emp:'Empleado'}[S.u.role]}</b><span class="sp"></span><span>${esc(S.u.n)}</span><button onclick="logout()">Salir</button></div><div class="pad" id="vw"></div></main>`;  
const v={dash,list,inbox,new:nw,det,rep,users,areas,types,cfg,notifs,prof}[S.v];let html;try{html=v()}catch(e){console.error(e);html='<div class="card"><h2>No se pudo mostrar esta sección</h2><p>Ocurrió un problema inesperado. Recarga la página o vuelve al Dashboard.</p><button class="p" onclick="go(\'dash\')">Ir al Dashboard</button></div>'}document.getElementById('vw').innerHTML=html}  
function render(){try{render0()}catch(e){console.error(e);document.getElementById('app').innerHTML='<div class="login card"><h1>SIGI</h1><p>Ocurrió un error al mostrar la pantalla.</p><button class="p" onclick="location.reload()">Recargar</button> <button onclick="logout()">Cerrar sesión</button></div>'}}  
function filters(){const f=S.f,r=S.u.role;return `<div class="bar"><div><label>Período</label><select onchange="sf('per',this.value)">${opts([['all','Todo'],['today','Hoy'],['week','Esta semana'],['month','Este mes'],['year','Este año'],['custom','Rango']],f.per)}</select></div>  
${f.per=='custom'?`<div><label>Desde</label><input type="date" value="${f.from||''}" onchange="sf('from',this.value)"></div><div><label>Hasta</label><input type="date" value="${f.to||''}" onchange="sf('to',this.value)"></div>`:''}  
<div><label>Área</label><select onchange="sf('area',this.value)">${opts(db.areas.map(x=>[x.id,x.n]),f.area,'Todas')}</select></div>  
<div><label>Responsable</label><select onchange="sf('resp',this.value)">${opts(db.users.filter(u=>u.role=='resp').map(x=>[x.id,x.n]),f.resp,'Todos')}</select></div>  
<div><label>Tipo</label><select onchange="sf('type',this.value)">${opts(db.types.map(x=>[x.id,x.n]),f.type,'Todos')}</select></div>  
<div><label>Prioridad</label><select onchange="sf('prio',this.value)">${opts(PR.map((p,i)=>[i,p]),f.prio,'Todas')}</select></div>  
<div><label>Estado</label><select onchange="sf('st',this.value)">${opts(ST.map(s=>[s,s]),f.st,'Todos')}</select></div></div>`}  
const sf=(k,v)=>{S.f[k]=v;S.pg=0;render()};  
function dash(){const l=filt(visible(),S.f),k=kpis(l),by=st=>l.filter(q=>q.status==st).length;  
const days=[...Array(14)].map((_,i)=>{const d=new Date(Date.now()-(13-i)*D);return[d.toLocaleDateString('es',{day:'2-digit',month:'short'}),l.filter(q=>new Date(q.created).toDateString()==d.toDateString()).length]});  
const tm={};l.forEach(q=>{const e=q.resolvedAt||q.closedAt;if(e){const n=T(q.type).n;(tm[n]=tm[n]||[]).push(e-q.created)}});  
const avt=Object.entries(tm).map(([n,a])=>[n,Math.round(a.reduce((x,y)=>x+y,0)/a.length/H)]).sort((a,b)=>b[1]-a[1]);  
const msg={admin:'¿Qué está ocurriendo en la organización?',resp:'Tus solicitudes asignadas',emp:'Tus solicitudes y su estado'}[S.u.role];  
return `<h1>Dashboard</h1><p style="color:var(--mu)">${msg}</p>${filters()}<div class="grid">${[['Total',k.tot],['Pendientes',k.pen],['Asignadas',by('Asignada')],['En proceso',by('En proceso')],['Resueltas',k.res],['Cerradas',by('Cerrada')],['Atrasadas',k.late],['Próximas a vencer',k.warn],['Tiempo prom. resolución',k.av?hh(k.av):'—'],['Resueltas en plazo',k.pok+'%'],['% atrasadas',k.pl+'%']].map(x=>`<div class="k"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}</div>  
<div class="g2"><div class="card"><h2>Solicitudes por estado</h2>${hbars(ST.map(s=>[s,by(s)]))}</div><div class="card"><h2>Por área</h2>${hbars(grp(l,q=>A(q.areaResp).n))}</div><div class="card"><h2>Por tipo</h2>${hbars(grp(l,q=>T(q.type).n))}</div><div class="card"><h2>Por prioridad</h2>${hbars(PR.map((p,i)=>[p,l.filter(q=>q.prio==i).length]))}</div><div class="card"><h2>Creadas en los últimos 14 días</h2>${hbars(days)}</div><div class="card"><h2>Tiempo promedio de resolución (horas) por tipo</h2>${hbars(avt)}</div></div>`}  
function table(l,opt={}){const f=S.q.toLowerCase();l=l.filter(q=>!f||(q.code+q.title+(U(q.assignee)?.n||'')).toLowerCase().includes(f));
